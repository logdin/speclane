name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline suite (static, workflow harness, embedded scripts, examples)
        run: tests/run.sh
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .
